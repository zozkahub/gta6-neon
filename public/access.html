<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> </title><link rel="stylesheet" href="/styles.css"></head><body style="min-height:100vh;display:grid;place-items:center;background:#05050b"><div style="width:min(410px,88vw);padding:28px;text-align:center;background:rgba(9,8,17,.86);border:1px solid rgba(255,255,255,.12);box-shadow:0 35px 100px rgba(0,0,0,.65),0 0 55px rgba(255,46,163,.09)"><img src="/assets/gta6-logo-neon.png" style="width:200px;max-width:70%;filter:drop-shadow(0 0 18px rgba(255,46,164,.26))" alt=""><div style="height:1px;background:linear-gradient(90deg,transparent,#ff4fac,transparent);margin:18px 0 24px"></div><form id="f"><input id="code" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="CODE" style="width:100%;height:46px;text-align:center;background:#06060d;color:#fff;border:1px solid rgba(255,255,255,.12);outline:0;font:700 13px 'DM Mono';letter-spacing:.4em"><button style="margin-top:12px;width:100%;height:46px;border:0;background:linear-gradient(90deg,#ff3fa5,#ff8dcc);color:#180813;font:800 11px 'Barlow Condensed';letter-spacing:.16em;cursor:pointer">ENTER</button><div id="m" style="font:600 9px 'DM Mono';color:#ff72bd;margin-top:12px;min-height:12px"></div></form></div><script>const f=document.querySelector('#f'),m=document.querySelector('#m');f.onsubmit=async e=>{e.preventDefault();m.textContent='';const r=await fetch('/_access',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:document.querySelector('#code').value})});if(r.ok)location.href='/control-bulk.html';else{m.textContent='TRY AGAIN';document.querySelector('#code').value=''}};</script></body></html>
