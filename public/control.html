<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="noise"></div><div class="scanlines"></div>
<header class="nav"><a class="nav-brand" href="/"><img src="/assets/gta6-logo-neon.png" alt=""></a><div class="nav-actions"><button id="logout" class="round-btn" aria-label="Close">×</button></div></header>
<main style="padding:130px 5vw 80px;max-width:1250px;margin:auto"><div class="overline">PRIVATE</div><h1 style="font:900 clamp(55px,8vw,105px)/.8 'Barlow Condensed';margin:8px 0 35px">MEDIA<br><span style="color:#ff56b1">CONTROL</span></h1>
<div style="display:grid;grid-template-columns:1fr 1.15fr;gap:18px">
<section style="padding:25px;background:#0a0912;border:1px solid rgba(255,255,255,.1)">
<form id="form"><label>NAME</label><input name="title" required maxlength="120" placeholder="CAR"><label>SUBTITLE</label><input name="subtitle" maxlength="180" placeholder="VICE CITY // NIGHT"><label>DIRECT VIDEO URL</label><input name="directUrl" maxlength="2048" placeholder="https://..."><label>LOCAL VIDEO</label><input id="file" name="file" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v,video/x-matroska,video/x-msvideo"><label>CATEGORY</label><input name="category" maxlength="40" placeholder="CARS / NIGHT / PLANES"><label>QUALITY</label><input name="quality" maxlength="20" placeholder="4K / 1080P"><label>SOURCE LABEL</label><input name="source" maxlength="80" placeholder="DIRECT"><label>DESCRIPTION</label><textarea name="description" maxlength="800" style="min-height:110px"></textarea><input id="duration" name="duration" type="hidden"><button type="submit" style="margin-top:16px;border:0;background:#ff55b0;color:#170710;padding:13px 16px;font:800 11px 'Barlow Condensed';letter-spacing:.14em;cursor:pointer">ADD MEDIA</button><div id="status" style="font:600 9px 'DM Mono';color:#8f899f;margin-top:12px;min-height:12px"></div></form>
</section><section style="padding:25px;background:#0a0912;border:1px solid rgba(255,255,255,.1)"><div class="overline">LIBRARY</div><div id="rows" style="margin-top:15px"></div></section></div></main>
<script>
let csrf='';
async function gate(){const r=await fetch('/_access/check',{cache:'no-store'});const j=await r.json();if(!j.ok){location.href='/_c9';return false}csrf=j.csrf;return true}
const form=document.querySelector('#form'),rows=document.querySelector('#rows'),status=document.querySelector('#status'),fileInput=document.querySelector('#file'),durationInput=document.querySelector('#duration');
const clean=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function makeThumb(file){const url=URL.createObjectURL(file);const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;await new Promise((resolve,reject)=>{v.onloadedmetadata=resolve;v.onerror=reject});const target=v.duration>1?1:Math.max(.05,v.duration-.05);v.currentTime=target;await new Promise((resolve,reject)=>{v.onseeked=resolve;v.onerror=reject});const c=document.createElement('canvas');const scale=Math.min(1,1280/v.videoWidth);c.width=Math.max(2,Math.round(v.videoWidth*scale));c.height=Math.max(2,Math.round(v.videoHeight*scale));c.getContext('2d').drawImage(v,0,0,c.width,c.height);URL.revokeObjectURL(url);return await new Promise(r=>c.toBlob(r,'image/jpeg',.9));}
fileInput.addEventListener('change',async()=>{durationInput.value='';const f=fileInput.files[0];if(!f)return;try{const v=document.createElement('video');v.preload='metadata';v.src=URL.createObjectURL(f);await new Promise((resolve,reject)=>{v.onloadedmetadata=resolve;v.onerror=reject});durationInput.value=String(v.duration||'');URL.revokeObjectURL(v.src);status.textContent='THUMBNAIL READY // FRAME 01.0S';const blob=await makeThumb(f);let old=document.querySelector('#generatedThumb');if(old)old.remove();const input=document.createElement('input');input.type='file';input.name='thumbnail';input.id='generatedThumb';input.hidden=true;const dt=new DataTransfer();dt.items.add(new File([blob],'thumb.jpg',{type:'image/jpeg'}));input.files=dt.files;form.appendChild(input);}catch{status.textContent='VIDEO THUMBNAIL FAILED';}});
async function load(){const r=await fetch('/api/videos',{cache:'no-store'});const data=await r.json();rows.innerHTML=data.map(v=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)"><div><b>${clean(v.title)}</b><div style="font:600 8px 'DM Mono';color:#787285;margin-top:5px">${clean(v.category)} · ${clean(v.mode)} · ${clean(v.source||'DIRECT')}</div></div><button data-id="${clean(v.id)}" style="border:1px solid rgba(255,82,177,.35);background:transparent;color:#ff74be;padding:9px 11px;cursor:pointer">DELETE</button></div>`).join('');rows.querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this item?'))return;const r=await fetch('/api/control/'+encodeURIComponent(b.dataset.id),{method:'DELETE',headers:{'x-csrf-token':csrf}});if(r.ok)load()});}
form.onsubmit=async e=>{e.preventDefault();if(!csrf)return;status.textContent='ADDING...';const direct=form.directUrl.value.trim();const file=fileInput.files[0];if((direct&&file)||(!direct&&!file)){status.textContent='USE ONE SOURCE ONLY';return}if(file&&!document.querySelector('#generatedThumb')){status.textContent='WAITING FOR THUMBNAIL';return}const r=await fetch('/api/control/add',{method:'POST',headers:{'x-csrf-token':csrf},body:new FormData(form)});let j={};try{j=await r.json()}catch{}status.textContent=r.ok?'ADDED':'ERROR: '+(j.error||'FAILED');if(r.ok){form.reset();const t=document.querySelector('#generatedThumb');if(t)t.remove();load()}};
document.querySelector('#logout').onclick=async()=>{await fetch('/_logout',{method:'POST',headers:{'x-csrf-token':csrf}});location.href='/'};
(async()=>{if(await gate())load()})();
</script></body></html>
